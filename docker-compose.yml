services:
  omp-bot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep container file ownership aligned with the host user so that
        # files created inside the container stay editable on the host.
        # Set these in .env:  HOST_UID=$(id -u)  HOST_GID=$(id -g)
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
        # Group that owns /var/run/docker.sock on the host, so the bot user can
        # open it:  stat -c %g /var/run/docker.sock
        DOCKER_GID: ${HOST_DOCKER_GID:-999}
    image: omp-telegram-bot:latest
    container_name: omp-telegram-bot
    restart: unless-stopped

    # ---- Host control -------------------------------------------------------
    # `privileged` exposes the host kernel namespaces and device access; with
    # `pid: host` the host PID namespace is reachable, so `nsenter -t 1` can run
    # any command against the real root filesystem, systemd, and process tree.
    # `network_mode: host` shares host loopback, so 127.0.0.1 services (beszel on
    # 8090, 9router on 20128) resolve without port publishing.
    # Net effect: the container boundary is advisory, not a security boundary.
    privileged: true
    pid: host
    network_mode: host
    # -------------------------------------------------------------------------

    env_file:
      - .env
    environment:
      DEFAULT_CWD: /workspace
      OMP_BIN: /usr/local/bin/omp
      HOME: /home/omp
      WORKSPACE_ROOT: /workspace
    volumes:
      # Explicit host paths are required: Compose does not expand ~ in bind paths.
      - ${HOST_OMP_BIN:?Set HOST_OMP_BIN to an absolute executable path}:/usr/local/bin/omp:ro
      # omp sessions and authentication; keep writable only where omp needs it.
      - ${HOST_OMP_HOME:?Set HOST_OMP_HOME to an absolute directory}:/home/omp/.omp
      # Provider definitions (may contain API keys).
      - ${HOST_OMP_CONFIG:?Set HOST_OMP_CONFIG to an absolute directory}:/home/omp/.config/oh-my-pi:ro
      # GitHub SSH authority: the host key pair plus known_hosts, read-only.
      # Point HOST_SSH_DIR at an empty directory when pushing with GITHUB_TOKEN
      # over HTTPS instead of SSH.
      - ${HOST_SSH_DIR:?Set HOST_SSH_DIR to an absolute SSH directory}:/home/omp/.ssh:ro
      # Mount only the intended repository/project root, never the whole home directory.
      - ${HOST_WORKSPACE_DIR:?Set HOST_WORKSPACE_DIR to an absolute workspace directory}:/workspace

      # ---- Host access ------------------------------------------------------
      # Host daemon socket, so the bundled docker CLI drives host containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Whole host filesystem at /host: host /X is readable as /host/X, which
      # keeps every host file reachable to the read/edit/grep tools. The host's
      # own /host does not exist, so this never nests.
      - /:/host
      # Host home at its real path, so the primary workspace and any absolute
      # path under it are identical inside and outside the container.
      - ${HOST_WORKSPACE_DIR}:/home/ubuntu
      # -----------------------------------------------------------------------
    init: true
    stop_grace_period: 15s
